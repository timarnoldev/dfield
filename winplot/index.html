<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Winplot-style Plotter – 2D &amp; 3D graphs</title>
  <meta name="description" content="Touch-friendly 2D/3D function plotter inspired by Winplot: explicit, parametric, polar, implicit curves, inequalities, slope fields, surfaces, parameter sliders and animation.">
  <meta name="theme-color" content="#2d3a4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Winplot">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <a href="../" class="tb-btn home" title="All math tools" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h5v-6h3v6h5V9.5"/></svg>
    </a>
    <button id="btnPanel" class="tb-btn" title="Inventory (equations and parameters)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.4" class="fill"/><circle cx="4.5" cy="12" r="1.4" class="fill"/><circle cx="4.5" cy="18" r="1.4" class="fill"/></svg>
      <span class="lbl">Inventory</span>
    </button>
    <div class="seg" id="dimSeg" role="radiogroup" aria-label="Window">
      <button data-dim="2" class="on" title="2-dim window">2-dim</button>
      <button data-dim="3" title="3-dim window">3-dim</button>
    </div>
    <div id="title" class="eq-title"></div>
    <div class="seg" id="modeSeg2" role="radiogroup" aria-label="Touch mode">
      <button data-mode="pan" class="on" title="Pan: drag to move, pinch to zoom, tap a curve to select it">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>
        <span class="lbl">Pan</span>
      </button>
      <button data-mode="trace" title="Trace: touch a curve and slide along it (arrow keys step)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18c4 0 5-12 9-12s5 12 9 12"/><circle cx="12" cy="6" r="2.6" class="fill"/></svg>
        <span class="lbl">Trace</span>
      </button>
      <button data-mode="zoom" title="Zoom: drag a box, tap to zoom in 2×">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5 20 20M10 7v6M7 10h6"/></svg>
        <span class="lbl">Zoom</span>
      </button>
      <button data-mode="solve" title="Solve: tap to add a solution curve of the selected differential equation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l3-1M4 13l3 0M4 19l3 1M11 6l3-1M11 13l3 0M11 20l3 1"/><path d="M3 20C9 17 12 9 21 5"/></svg>
        <span class="lbl">Solve</span>
      </button>
    </div>
    <div class="seg" id="modeSeg3" role="radiogroup" aria-label="Touch mode" hidden>
      <button data-mode="rotate" class="on" title="One-finger drag rotates">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></svg>
        <span class="lbl">Rotate</span>
      </button>
      <button data-mode="pan" title="One-finger drag pans">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>
        <span class="lbl">Pan</span>
      </button>
    </div>
    <button id="btnFit" class="tb-btn" title="Zoom to fit / reset 3D view">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
      <span class="lbl">Fit</span>
    </button>
    <button id="btnMenu" class="tb-btn" title="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6" class="fill"/><circle cx="12" cy="12" r="1.6" class="fill"/><circle cx="19" cy="12" r="1.6" class="fill"/></svg>
      <span class="lbl">Menu</span>
    </button>
  </header>

  <main>
    <aside id="panel" class="panel">
      <div class="panel-head">
        <strong id="invTitle">Inventory</strong>
        <span class="spacer"></span>
        <button type="button" id="btnExamples" class="pill" title="Example library">Examples</button>
        <button type="button" id="btnAdd" class="pill accent" title="Add an equation">+ Add</button>
        <button type="button" id="btnPanelClose" class="icon-btn close-panel" aria-label="Close">✕</button>
      </div>
      <ul id="inventory" class="inventory"></ul>
      <p id="invEmpty" class="empty" hidden>No equations yet. Tap <b>+ Add</b> or open the <b>Examples</b>.</p>

      <section id="paramSection" class="params" hidden>
        <h3>Parameters</h3>
        <div id="params"></div>
      </section>
      <p class="hint panel-hint" id="panelHint"></p>
    </aside>

    <section class="plot-area">
      <div id="wrap2" class="plot-wrap">
        <canvas id="base2"></canvas>
        <canvas id="over2"></canvas>
      </div>
      <div id="wrap3" class="plot-wrap" hidden>
        <canvas id="gl3"></canvas>
        <div id="noGL" class="nogl" hidden>WebGL is not available in this browser, so the 3-dim window cannot be shown.</div>
      </div>
      <footer class="statusbar">
        <span id="status">Ready.</span>
        <span id="coords"></span>
      </footer>
    </section>
  </main>
  <div id="scrim" class="scrim" hidden></div>

  <!-- Main menu (content built dynamically) -->
  <dialog id="menuDlg" class="sheet">
    <div class="sheet-head"><strong id="menuTitle">Menu</strong><button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="sheet-body" id="menuBody"></div>
  </dialog>

  <!-- Generic dialog -->
  <dialog id="dlg" class="modal">
    <form method="dialog" id="dlgForm" autocomplete="off" spellcheck="false">
      <div class="sheet-head"><strong id="dlgTitle"></strong><button class="icon-btn" value="cancel" formnovalidate aria-label="Close">✕</button></div>
      <div id="dlgBody" class="dlg-body"></div>
      <div id="dlgButtons" class="dlg-buttons"></div>
    </form>
  </dialog>

  <input type="file" id="fileOpen" accept=".json,application/json" hidden>
  <script type="module" src="js/app.js"></script>
</body>
</html>
