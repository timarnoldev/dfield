<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Mathlets – Interactive Calculus, ODE &amp; Signals Demos</title>
  <meta name="description" content="Touch-friendly interactive demos for calculus, differential equations and signals: Fourier series, resonance, convolution, poles, phase portraits, Euler's method, Taylor polynomials, Riemann sums and more.">
  <meta name="theme-color" content="#2d3a4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mathlets">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <a id="btnHome" class="tb-btn" href="../" title="All apps">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h5v-6h3v6h5V9.5"/></svg>
      <span class="lbl">Home</span>
    </a>
    <button id="btnPanel" class="tb-btn" title="Show / hide controls">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span class="lbl">Controls</span>
    </button>
    <button id="btnChooser" class="tb-btn" title="Choose a mathlet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
      <span class="lbl">Mathlets</span>
    </button>
    <div id="title" class="eq-title"></div>
    <button id="btnPlay" class="tb-btn" title="Play / pause animation (Space)" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-play"><path d="M7 5v14l12-7z" class="fill"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-pause"><rect x="6" y="5" width="4" height="14" rx="1" class="fill"/><rect x="14" y="5" width="4" height="14" rx="1" class="fill"/></svg>
      <span class="lbl">Play</span>
    </button>
    <button id="btnReset" class="tb-btn" title="Reset this mathlet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>
      <span class="lbl">Reset</span>
    </button>
    <button id="btnMenu" class="tb-btn" title="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6" class="fill"/><circle cx="12" cy="12" r="1.6" class="fill"/><circle cx="19" cy="12" r="1.6" class="fill"/></svg>
      <span class="lbl">Menu</span>
    </button>
  </header>

  <main>
    <aside id="panel" class="panel">
      <div class="panel-tabs seg seg-wide" role="tablist">
        <button id="tabControls" class="on" role="tab">Controls</button>
        <button id="tabList" role="tab">All mathlets</button>
      </div>
      <div id="controlsView">
        <h2 id="mlTitle" class="ml-title"></h2>
        <p id="mlShort" class="description"></p>
        <div id="controls"></div>
        <section class="explain">
          <h3>What's going on?</h3>
          <div id="mlInfo"></div>
        </section>
      </div>
      <div id="listView" hidden>
        <div id="cardList" class="card-list"></div>
      </div>
    </aside>

    <section class="plot-area">
      <div id="stage" class="stage"></div>
      <footer class="statusbar">
        <span id="status"></span>
        <span id="coords"></span>
      </footer>
    </section>
  </main>

  <!-- Main menu -->
  <dialog id="menuDlg" class="sheet">
    <div class="sheet-head"><strong>Mathlets</strong><button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="sheet-body">
      <section>
        <h3>This mathlet</h3>
        <button data-action="reset">Reset to defaults</button>
        <button data-action="savePng">Save image (PNG)…</button>
        <button data-action="copyLink">Copy link to this mathlet</button>
      </section>
      <section>
        <h3>All mathlets</h3>
        <button data-action="chooser">Choose a mathlet…</button>
        <button data-action="resetAll">Reset all mathlets…</button>
      </section>
      <section>
        <h3>Help</h3>
        <button data-action="help">Using the mathlets (touch, mouse, keyboard)</button>
        <button data-action="syntax">Expression syntax</button>
        <button data-action="about">About</button>
      </section>
    </div>
  </dialog>

  <!-- Generic dialog -->
  <dialog id="dlg" class="modal">
    <form method="dialog" id="dlgForm">
      <div class="sheet-head"><strong id="dlgTitle"></strong><button class="icon-btn" value="cancel" formnovalidate aria-label="Close">✕</button></div>
      <div id="dlgBody" class="dlg-body"></div>
      <div id="dlgButtons" class="dlg-buttons"></div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
