<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>XplorMath – Mathematical Object Explorer</title>
  <meta name="description" content="A touch-friendly museum of mathematical objects: surfaces, space and plane curves, polyhedra, fractals and chaotic dynamics. Inspired by 3D-XplorMath.">
  <meta name="theme-color" content="#2d3a4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="XplorMath">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
  <header class="toolbar">
    <a href="../" id="btnHome" class="tb-btn" title="All math tools">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h5v-6h3v6h5V9.5"/></svg>
    </a>
    <button id="btnPanel" class="tb-btn" title="Objects and parameters">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      <span class="lbl">Panel</span>
    </button>
    <div class="seg" id="catSeg" role="tablist" aria-label="Category">
      <button data-cat="surface" title="Surfaces">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15c3-1 4-7 9-7s6 6 9 7"/><path d="M3 15c4 3 14 3 18 0"/><path d="M8 9.5c1 3 1 6 0 8.5M16 9.5c-1 3-1 6 0 8.5"/></svg>
        <span class="lbl">Surfaces</span>
      </button>
      <button data-cat="curve" title="Space curves">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20c-4-3 2-7 6-5s10 1 6-4-10-3-8-7"/></svg>
        <span class="lbl">Space curves</span>
      </button>
      <button data-cat="plane" title="Plane curves">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-3-4-9-2-8 3 1 6 8 9 8 11 0-2 7-5 8-11 1-5-5-7-8-3z"/></svg>
        <span class="lbl">Plane curves</span>
      </button>
      <button data-cat="poly" title="Polyhedra">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 8v8l-8 5-8-5V8z"/><path d="M12 3v9l8 4M12 12l-8 4"/></svg>
        <span class="lbl">Polyhedra</span>
      </button>
      <button data-cat="fractal" title="Fractals">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 21 19H3z"/><path d="M7.5 11h9M12 19l-4.5-8M12 19l4.5-8"/></svg>
        <span class="lbl">Fractals</span>
      </button>
      <button data-cat="ode" title="Dynamics (ODEs)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c-3-5-9-4-9 0s6 5 9 0 9-5 9 0-6 4-9 0"/></svg>
        <span class="lbl">Dynamics</span>
      </button>
    </div>
    <div id="objTitle" class="eq-title"></div>
    <button id="btnPlay" class="tb-btn" title="Animate (space)">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-play"><path d="M7 4.5v15l12-7.5z" class="fill"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-pause"><rect x="6" y="5" width="4" height="14" rx="1" class="fill"/><rect x="14" y="5" width="4" height="14" rx="1" class="fill"/></svg>
      <span class="lbl">Animate</span>
    </button>
    <button id="btnRotate" class="tb-btn toggle" title="Auto-rotate">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4.5h-4.5"/></svg>
      <span class="lbl">Rotate</span>
    </button>
    <button id="btnReset" class="tb-btn" title="Reset view (R)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6"/><circle cx="12" cy="12" r="2"/></svg>
      <span class="lbl">Reset</span>
    </button>
    <button id="btnMenu" class="tb-btn" title="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6" class="fill"/><circle cx="12" cy="12" r="1.6" class="fill"/><circle cx="19" cy="12" r="1.6" class="fill"/></svg>
    </button>
  </header>

  <main>
    <aside id="panel" class="panel">
      <div class="panel-head">
        <input id="search" type="search" placeholder="Search objects…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search objects">
        <button type="button" id="btnPanelClose" class="icon-btn close-panel" aria-label="Close">✕</button>
      </div>
      <button type="button" id="listToggle" class="list-toggle" aria-expanded="true"><span id="listTitle"></span><span class="chev">▾</span></button>
      <div id="objList" class="obj-list"></div>
      <div id="controls">
        <div class="obj-head">
          <h2 id="objName"></h2>
          <button type="button" id="btnAbout" class="pill">About</button>
        </div>
        <p id="objNote" class="description"></p>
        <fieldset id="paramSet"><legend>Parameters</legend><div id="paramBox"></div></fieldset>
        <p id="paramError" class="error" hidden></p>
        <fieldset id="displaySet"><legend>Display</legend><div id="displayBox"></div></fieldset>
      </div>
    </aside>

    <section class="stage" id="stage">
      <canvas id="gl"></canvas>
      <canvas id="c2d" hidden></canvas>
      <div id="info" class="info" hidden></div>
      <div id="legend" class="legend" hidden></div>
      <div id="busy" class="busy" hidden>Computing…</div>
      <div id="toast" class="toast" hidden></div>
    </section>
  </main>
  <div id="scrim" class="scrim" hidden></div>

  <dialog id="menuDlg" class="sheet">
    <div class="sheet-head"><strong>XplorMath</strong><button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="sheet-body">
      <section>
        <h3>View</h3>
        <div class="row"><label>Background</label>
          <div class="seg seg-wide seg-small" id="optBg"><button data-v="dark">Dark</button><button data-v="light">Light</button></div></div>
        <label class="check"><input type="checkbox" id="optAutoRotate"> Auto-rotate 3D objects</label>
        <label class="check"><input type="checkbox" id="optAxes"> Show coordinate axes</label>
        <div class="row"><label for="optQuality">Mesh resolution</label>
          <select id="optQuality"><option value="0.6">Low (fast)</option><option value="1">Medium</option><option value="1.5">High</option></select></div>
        <button data-action="reset">Reset view</button>
        <button data-action="fullscreen" id="btnFullscreen">Full screen</button>
      </section>
      <section>
        <h3>Export</h3>
        <button data-action="png">Save image (PNG)</button>
      </section>
      <section>
        <h3>Help</h3>
        <button data-action="aboutObj">About the current object</button>
        <button data-action="help">Touch, mouse &amp; keyboard controls</button>
        <button data-action="about">About XplorMath</button>
        <button data-action="resetAll">Restore default settings…</button>
      </section>
    </div>
  </dialog>

  <dialog id="dlg" class="modal">
    <form method="dialog" id="dlgForm">
      <div class="sheet-head"><strong id="dlgTitle"></strong><button class="icon-btn" value="cancel" formnovalidate aria-label="Close">✕</button></div>
      <div id="dlgBody" class="dlg-body"></div>
      <div id="dlgButtons" class="dlg-buttons"></div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
